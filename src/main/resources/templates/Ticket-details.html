<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${ticket.title} + ' – Helpdesk'">Ticket – Helpdesk</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #eef2f7; color: #1f2937; }
        nav { display: flex; align-items: center; justify-content: space-between; padding: 14px 32px; background: #1e3a5f; color: #fff; }
        nav .brand { font-size: 20px; font-weight: bold; color: #fff; text-decoration: none; }
        nav .user { display: flex; align-items: center; gap: 16px; font-size: 14px; }
        nav form { margin: 0; }
        nav button { padding: 6px 14px; background: transparent; color: #fff; border: 1px solid #fff; border-radius: 6px; cursor: pointer; }
        nav button:hover { background: rgba(255, 255, 255, 0.15); }
        main { max-width: 800px; margin: 32px auto; padding: 0 20px; }
        .back { color: #2563eb; text-decoration: none; font-size: 14px; }
        .back:hover { text-decoration: underline; }
        .title-row { display: flex; align-items: center; gap: 14px; }
        h1 { color: #1e3a5f; margin: 12px 0; }
        .status { padding: 4px 12px; border-radius: 12px; font-size: 13px; font-weight: bold; background: #e5eaf1; }
        .card { background: #fff; border: 1px solid #d1d9e6; border-radius: 15px; box-shadow: 0 4px 12px rgba(30, 58, 95, 0.08); padding: 24px 28px; margin-bottom: 20px; }
        .meta { display: grid; grid-template-columns: 140px 1fr; row-gap: 10px; font-size: 14px; }
        .meta dt { color: #5b6b82; font-weight: bold; }
        .meta dd { margin: 0; }
        h2 { font-size: 16px; color: #1e3a5f; margin-top: 0; }
        .description { white-space: pre-wrap; line-height: 1.5; }
    </style>
</head>
<body>

<nav>
    <a class="brand" th:href="@{/tickets}">Helpdesk</a>
    <div class="user">
        <span>Logged in as <strong sec:authentication="name"></strong></span>
        <form th:action="@{/logout}" method="post">
            <button type="submit">Log out</button>
        </form>
    </div>
</nav>

<main>
    <a class="back" th:href="@{/tickets}">&larr; Back to tickets</a>

    <div class="title-row">
        <h1 th:text="'#' + ${ticket.id} + ' ' + ${ticket.title}"></h1>
        <span class="status" th:text="${ticket.status}"></span>
    </div>

    <div class="card">
        <dl class="meta">
            <dt>Created by</dt>
            <dd th:text="${ticket.creator.username}"></dd>

            <dt>Assigned to</dt>
            <dd th:text="${ticket.assignee != null ? ticket.assignee.username : 'Not assigned'}"></dd>

            <dt>Created</dt>
            <dd th:text="${#temporals.format(ticket.createdAt, 'yyyy-MM-dd HH:mm')}"></dd>

            <dt>Last updated</dt>
            <dd th:text="${#temporals.format(ticket.lastModifiedAt, 'yyyy-MM-dd HH:mm')}"></dd>
        </dl>
    </div>

    <div class="card">
        <h2>Description</h2>
        <p class="description" th:text="${ticket.description}"></p>
    </div>

    <!-- Kommentarer läggs till här i nästa steg -->
</main>

</body>
</html>
