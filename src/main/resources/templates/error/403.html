<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Access denied – Helpdesk</title>
    <style>
        body { margin: 0; min-height: 100vh; font-family: Arial, sans-serif; background: #eef2f7; color: #1f2937;
            display: flex; align-items: center; justify-content: center; }
        .card { background: #fff; border: 1px solid #d1d9e6; border-radius: 15px; box-shadow: 0 4px 12px rgba(30, 58, 95, 0.08);
            padding: 40px 48px; text-align: center; max-width: 420px; }
        .code { font-size: 64px; font-weight: bold; color: #1e3a5f; margin: 0; }
        h1 { font-size: 22px; color: #1e3a5f; margin: 8px 0 12px; }
        p { color: #5b6b82; line-height: 1.5; }
        a { display: inline-block; margin-top: 16px; padding: 10px 18px; background: #2563eb; color: #fff;
            text-decoration: none; border-radius: 6px; font-weight: bold; }
        a:hover { background: #1d4ed8; }
    </style>
</head>
<body>
<div class="card">
    <p class="code">403</p>
    <h1>Access denied</h1>
    <p>You don't have permission to view this page.</p>
    <a th:href="@{/tickets}">Back to tickets</a>
</div>
</body>
</html>
