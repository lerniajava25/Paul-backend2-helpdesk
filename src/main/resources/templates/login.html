<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login – Helpdesk</title>
    <style>
        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            color: #1f2937;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: -5% 0 0;
        }

        h1 {
            color: #1e3a5f;
            margin-bottom: 20px;
        }

        .login-form {
            width: 30%;
            min-width: 300px;
            padding: 28px;
            background: #ffffff;
            border: 1px solid #d1d9e6;
            border-radius: 15px;
            box-shadow: 0 4px 12px rgba(30, 58, 95, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .login-form h2 {
            margin-top: 0;
            color: #1e3a5f;
        }

        .field {
            width: 80%;
            display: flex;
            flex-direction: column;
            margin-bottom: 14px;
        }

        .field label {
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
        }

        .field input {
            padding: 10px;
            border: 1px solid #b8c4d6;
            border-radius: 6px;
            font-size: 15px;
        }

        .field input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .login-form button {
            width: 80%;
            margin-top: 20px;
            margin-bottom: 10px;
            padding: 15px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-form button:hover {
            background: #1d4ed8;
        }

        .message {
            width: 80%;
            box-sizing: border-box;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        .info {
            background: #d4edda;
            color: #155724;
        }
    </style>
</head>
<body>
<h1>Helpdesk</h1>

<form class="login-form" th:action="@{/login}" method="post">
    <h2>Login</h2>

    <p class="message error" th:if="${param.error}">Invalid username or password</p>
    <p class="message info" th:if="${param.logout}">You have been logged out</p>

    <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus>
    </div>

    <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
    </div>

    <button type="submit">Login</button>
</form>
</body>
</html>
